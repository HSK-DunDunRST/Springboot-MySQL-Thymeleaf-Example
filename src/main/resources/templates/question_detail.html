<!DOCTYPE html>
<html layout:decorate="~{layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${question.subject} + ' - Q&A 시스템'">질문 상세 - Q&A 시스템</title>
</head>
<body>
<div layout:fragment="content" class="fade-in">
    <!-- 뒤로가기 버튼 -->
    <div class="mb-3">
        <a th:href="@{/question/list}" class="btn btn-outline-secondary">목록으로</a>
    </div>

    <!-- 질문 상세 내용 -->
    <div class="question-detail">
        <div class="d-flex justify-content-between align-items-start">
            <h2 class="h2 text-primary" th:text="${question.subject}">질문 제목</h2>
            <div class="d-flex gap-2">
                <a th:href="@{|/question/modify/${question.id}|}" class="btn btn-warning">수정</a>
                <a th:href="@{|/question/delete/${question.id}|}" class="btn btn-danger" onclick="return confirm('정말로 이 질문을 삭제하시겠습니까?')">
                    삭제
                </a>
            </div>
        </div>

        <div class="question-meta">
            <span class="badge text-primary me-2">
                작성일: <span th:text="${#temporals.format(question.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
            </span>
            <span th:if="${question.updatedAt != null}" class="badge bg-secondary">
                수정일: <span th:text="${#temporals.format(question.updatedAt, 'yyyy-MM-dd HH:mm')}"></span>
            </span>
        </div>
        <div class="question-content border-top" th:text="${question.content}">질문 내용</div>
    </div>

    <!-- 답변 목록 -->
    <div class="answer-section" id="answer">
        <h3 class="h4 text-success m-2 border-bottom">
            답변 <span class="text-success" th:text="${question.answerList.size()}">0</span>개
        </h3>

        <!-- 답변이 없을 때 -->
        <div th:if="${question.answerList.isEmpty()}" class="text-center py-4">
            <h5 class="text-muted">아직 답변이 없습니다.</h5>
            <p class="text-muted">첫 번째 답변을 작성해보세요!</p>
        </div>

        <!-- 답변 리스트 -->
        <div th:unless="${question.answerList.isEmpty()}">
            <div th:each="answer : ${question.answerList}" class="answer-item">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <div class="answer-meta">
                        <span class="badge bg-success me-2">
                            <span th:text="${#temporals.format(answer.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                        </span>
                        <span th:if="${answer.updatedAt != null}" class="badge bg-secondary">
                            수정: <span th:text="${#temporals.format(answer.updatedAt, 'yyyy-MM-dd HH:mm')}"></span>
                        </span>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{|/answer/modify/${answer.id}|}" class="btn btn-warning btn-sm">수정</a>
                        <a th:href="@{|/answer/delete/${answer.id}|}" class="btn btn-danger btn-sm" onclick="return confirm('정말로 이 답변을 삭제하시겠습니까?')">삭제</a>
                    </div>
                </div>
                <div class="answer-content" th:text="${answer.content}">답변 내용</div>
            </div>
        </div>
    </div>

    <!-- 관련 질문 추천 (선택사항) -->
    <div class="mt-4">
        <div class="card bg-light">
            <div class="card-header">
                <h6 class="mb-0">다른 질문도 확인해보세요.</h6>
            </div>
            <div class="card-body">
                <div class="d-flex gap-2 flex-wrap">
                    <a th:href="@{/question/list}" class="btn btn-outline-primary btn-sm">전체 질문 보기</a>
                    <a th:href="@{/question/create}" class="btn btn-outline-primary btn-sm">새 질문 등록</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script layout:fragment="script">
// 답변 등록 후 답변 영역으로 스크롤
document.addEventListener('DOMContentLoaded', function() {
    if (window.location.hash === '#answer') {
        document.getElementById('answer').scrollIntoView();
    }
});
</script>
</body>
</html>
