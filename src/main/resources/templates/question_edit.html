<!DOCTYPE html>
<html layout:decorate="~{layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>질문 수정 - Q&A 시스템</title>
</head>
<body>
<div layout:fragment="content" class="fade-in">
    <div class="mb-3">
        <a th:href="@{/question/detail/{id}(id=${question.id})}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-2"></i>상세보기
        </a>
    </div>
    <div class="mb-4">
        <h1 class="h2 text-warning">
            <i class="fas fa-pen me-2"></i>질문 수정
        </h1>
        <p class="text-muted">질문 내용을 수정할 수 있습니다.</p>
    </div>
    <div class="card">
        <div class="card-body">
            <form th:action="@{|/question/modify/${question.id}|}" th:object="${questionForm}" method="post">
                <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
                    <strong>오류가 발생했습니다!</strong>
                    <ul class="mb-0">
                        <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
                    </ul>
                </div>
                <div class="mb-4">
                    <label for="subject" class="form-label">질문 제목</label>
                    <input type="text" id="subject" class="form-control" th:field="*{subject}">
                </div>
                <div class="mb-4">
                    <label for="content" class="form-label">질문 내용</label>
                    <textarea id="content" rows="10" class="form-control" th:field="*{content}"></textarea>
                </div>
                <div class="d-flex justify-content-between">
                    <a th:href="@{/question/detail/{id}(id=${question.id})}" class="btn btn-secondary">취소</a>
                    <button type="submit" class="btn btn-warning">
                        <i class="fas fa-save me-2"></i>
                        수정 완료
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
