<!DOCTYPE html>
<html layout:decorate="~{layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>답변 수정 - Q&A 시스템</title>
</head>
<body>
    <div layout:fragment="content" class="fade-in">
        <!-- 답변 작성 폼 -->
        <div class="mt-4 p-4 border-top">
            <h5 class="text-primary">답변 작성</h5>
            <form th:action="@{|/answer/create/${question.id}|}" th:object="${answerForm}" method="post">
                <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}" role="alert">
                    <strong>오류가 발생했습니다!</strong>
                    <ul class="mb-0">
                        <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
                    </ul>
                </div>

                <div class="mb-3 p-2">
                    <label for="content" class="form-label">답변 내용</label>
                    <textarea class="form-control" th:field="*{content}" id="content" rows="5" placeholder="답변을 입력해주세요..." th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
                </div>

                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-success">답변 등록</button>
                </div>
            </form>
        </div>
    </div>

    <script layout:fragment="script">
        // 폼 유효성 검사 및 미리보기
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const contentTextarea = document.getElementById('content');
            const previewContent = document.getElementById('preview-content');

            // 실시간 미리보기
            contentTextarea.addEventListener('input', function() {
                updatePreview();
            });

            function updatePreview() {
                const content = contentTextarea.value.trim();
                if (content) {
                    previewContent.innerHTML = content.replace(/\n/g, '<br>');
                    previewContent.classList.remove('text-muted');
                } else {
                    previewContent.innerHTML = '내용을 입력하면 미리보기가 표시됩니다.';
                    previewContent.classList.add('text-muted');
                }
            }

            // 미리보기 토글
            window.togglePreview = function() {
                updatePreview();
            };

            // 폼 제출 시 확인
            form.addEventListener('submit', function(e) {
                const content = contentTextarea.value.trim();

                if (!content) {
                    e.preventDefault();
                    alert('답변 내용을 입력해주세요.');
                    contentTextarea.focus();
                    return false;
                }

                if (content.length < 5) {
                    e.preventDefault();
                    alert('답변은 5자 이상 입력해주세요.');
                    contentTextarea.focus();
                    return false;
                }

                return confirm('답변을 수정하시겠습니까?');
            });

            // 초기 미리보기 설정
            updatePreview();
        });
    </script>
</body>
</html>
